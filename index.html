<!DOCTYPE html>
<html lang="zh" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TREND AGENT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0C0C0C;--s1:#161616;--s2:#1E1E1E;--s3:#252525;
  --bd:#2A2A2A;--tx:#F0EDE8;--dim:#88887A;
  --ac:#D4C5A9;--ac2:#E8D5B0;
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── Header ── */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:13px 22px;border-bottom:1px solid var(--bd);flex-shrink:0}
.logo{font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:700;letter-spacing:.18em;color:var(--ac)}
.logo-s{font-size:10px;color:var(--dim);letter-spacing:.07em;margin-top:2px}
.api-chip{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);cursor:pointer;padding:5px 11px;border:1px solid var(--bd);border-radius:20px;transition:.2s}
.api-chip:hover{border-color:var(--ac)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--bd);transition:.3s}
.dot.on{background:#5C9}

/* ── Layout ── */
.wrap{display:flex;flex:1;min-height:0;overflow:hidden}

/* ── LEFT SIDEBAR ── */
.left{width:260px;flex-shrink:0;border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.left-input{flex-shrink:0;padding:14px 16px;border-bottom:1px solid var(--bd)}
.input-lbl{font-size:9px;font-weight:600;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;margin-bottom:8px}
textarea.field{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:7px;padding:9px 11px;color:var(--tx);font-size:11px;font-family:inherit;outline:none;line-height:1.65;resize:none;height:110px;transition:.2s}
textarea.field:focus{border-color:var(--ac)}
textarea.field::placeholder{color:var(--dim)}
.btn-go{width:100%;padding:10px;background:var(--ac);border:none;border-radius:7px;color:#0C0C0C;font-size:12px;font-weight:700;font-family:'Space Grotesk',sans-serif;letter-spacing:.05em;cursor:pointer;transition:.2s;margin-top:8px}
.btn-go:hover{background:var(--ac2)}
.btn-go:disabled{opacity:.35;cursor:not-allowed}

/* ── NAV ── */
.left-nav{flex:1;min-height:0;overflow-y:auto;padding:10px 10px}
.nav-section{margin-bottom:6px}
.nav-sec-lbl{font-size:9px;font-weight:600;letter-spacing:.15em;color:var(--dim);text-transform:uppercase;padding:12px 8px 6px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:12px;color:var(--dim);transition:.15s;user-select:none;margin-bottom:1px}
.nav-item:hover{background:var(--s2);color:var(--tx)}
.nav-item.active{background:var(--s2);color:var(--tx)}
.nav-ico{font-size:12px;width:16px;text-align:center;flex-shrink:0;opacity:.7}
.nav-item.active .nav-ico{opacity:1}
.nav-subs{padding:0 0 4px 34px;display:flex;flex-direction:column;gap:1px}
.nav-sub{padding:5px 9px;border-radius:5px;font-size:11px;color:var(--dim);cursor:pointer;transition:.15s}
.nav-sub:hover{color:var(--tx);background:var(--s3)}
.nav-sub.active{color:var(--ac);font-weight:500}
.nav-empty{padding:20px 8px;font-size:11px;color:var(--dim);line-height:1.7;opacity:.6}

/* ── RIGHT PANEL ── */
.right{flex:1;min-height:0;overflow-y:auto}
.view{padding:30px 36px 48px}

/* View header */
.view-hdr{margin-bottom:28px}
.view-en{font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:600;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin-bottom:6px}
.view-t{font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:700;line-height:1;letter-spacing:-.02em}
.view-sub{font-size:13px;color:var(--dim);margin-top:10px;line-height:1.8;max-width:580px}

/* ── BOARD VIEW ── */
.brd-hdr{margin-bottom:24px}
.t-en{font-family:'Space Grotesk',sans-serif;font-size:42px;font-weight:700;line-height:1;letter-spacing:-.025em;word-break:break-word}
.t-zh{font-size:13px;color:var(--dim);margin-top:6px;letter-spacing:.12em}
.t-def{font-size:12px;line-height:1.85;color:var(--dim);margin-top:10px;max-width:580px}
.pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}
.pill{padding:3px 11px;border:1px solid var(--bd);border-radius:20px;font-size:11px;color:var(--dim)}
.img-box{overflow:hidden;border-radius:8px;background:var(--s2);position:relative}
.img-box img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .4s}
.shimmer{position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);animation:sh 1.4s infinite}
@keyframes sh{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* Story */
.story-hero{height:240px;margin-bottom:20px;border-radius:11px;background:var(--s2);overflow:hidden;position:relative}
.story-hero img{width:100%;height:100%;object-fit:cover}
.story-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55),transparent 55%)}
.story-flow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sc{background:var(--s1);border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.sc-img{height:70px;background:var(--s2);position:relative}
.sc-img img{width:100%;height:100%;object-fit:cover}
.sc-body{padding:11px}
.sc-lbl{font-size:8.5px;font-weight:600;letter-spacing:.18em;color:var(--ac);text-transform:uppercase;margin-bottom:6px}
.sc-txt{font-size:11px;line-height:1.65;color:var(--tx)}

/* CMF */
.cmf-pal{display:flex;gap:3px;height:52px;border-radius:8px;overflow:hidden;margin-bottom:18px}
.sw{flex:1;display:flex;align-items:flex-end;padding:5px;cursor:pointer;transition:flex .3s}
.sw:hover{flex:2.5}
.sw-lbl{font-size:9px;font-weight:600;color:rgba(255,255,255,.9);text-shadow:0 1px 3px rgba(0,0,0,.7);opacity:0;transition:.2s;white-space:nowrap;overflow:hidden}
.sw:hover .sw-lbl{opacity:1}
.cmf-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cmf-card{background:var(--s1);border:1px solid var(--bd);border-radius:9px;overflow:hidden}
.cmf-card-img{height:155px;background:var(--s2);position:relative}
.cmf-card-img img{width:100%;height:100%;object-fit:cover}
.cmf-card-body{padding:13px}
.cmf-card-en{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;margin-bottom:2px}
.cmf-card-zh{font-size:10px;color:var(--dim);margin-bottom:8px;letter-spacing:.05em}
.cmf-card-dir{font-size:11px;line-height:1.6;color:var(--dim);margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--bd)}
.color-dots{display:flex;gap:4px;margin-bottom:8px}
.cdot{width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(255,255,255,.1);cursor:pointer;transition:.2s}
.cdot:hover{transform:scale(1.3)}
.cmf-row{display:flex;gap:5px;margin-bottom:4px}
.cmf-k{font-size:8.5px;font-weight:600;letter-spacing:.1em;color:var(--ac);text-transform:uppercase;white-space:nowrap;min-width:46px;margin-top:1px}
.cmf-v{font-size:10.5px;color:var(--dim);line-height:1.5}

/* Collage */
.col-bg{font-family:'Space Grotesk',sans-serif;font-size:90px;font-weight:700;color:var(--tx);opacity:.04;line-height:.9;text-transform:uppercase;word-break:break-all;position:absolute;top:-5px;left:-5px;width:calc(100% + 10px);pointer-events:none}
.col-wrap{position:relative;min-height:400px}
.col-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative;z-index:1;padding:6px}
.col-card{background:var(--s1);border:1px solid var(--bd);border-radius:8px;overflow:hidden;box-shadow:0 5px 18px rgba(0,0,0,.4)}
.col-card:nth-child(1){transform:rotate(-1.8deg) translateY(-5px)}
.col-card:nth-child(2){transform:rotate(.7deg) translateY(7px)}
.col-card:nth-child(3){transform:rotate(-1deg) translateY(-3px)}
.col-card:nth-child(4){transform:rotate(1.8deg) translateY(5px)}
.col-card:nth-child(5){transform:rotate(-1.2deg) translateY(-6px)}
.col-card:nth-child(6){transform:rotate(1deg) translateY(4px)}
.col-img{height:110px;background:var(--s2);position:relative}
.col-img img{width:100%;height:100%;object-fit:cover}
.col-body{padding:12px}
.col-tag{font-size:8.5px;letter-spacing:.15em;color:var(--ac);font-weight:600;text-transform:uppercase;margin-bottom:5px}
.col-txt{font-size:11px;line-height:1.65;color:var(--tx)}

/* Minimal */
.min-hero{height:270px;border-radius:11px;overflow:hidden;background:var(--s2);margin-bottom:22px;position:relative}
.min-hero img{width:100%;height:100%;object-fit:cover}
.min-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to right,rgba(12,12,12,.65) 35%,transparent)}
.min-name{font-family:'Space Grotesk',sans-serif;font-size:56px;font-weight:700;line-height:.95;letter-spacing:-.03em;word-break:break-word;position:absolute;top:50%;left:28px;transform:translateY(-50%);z-index:1;max-width:60%}
.min-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.min-card{background:var(--s1);border:1px solid var(--bd);border-radius:9px;overflow:hidden}
.min-card-img{height:95px;background:var(--s2);position:relative}
.min-card-img img{width:100%;height:100%;object-fit:cover}
.min-card-body{padding:14px}
.min-card-lbl{font-size:8.5px;letter-spacing:.15em;color:var(--ac);text-transform:uppercase;margin-bottom:5px;font-weight:600}
.min-card-txt{font-size:11px;line-height:1.65;color:var(--tx)}

/* Map */
.map-wrap{background:var(--s1);border:1px solid var(--bd);border-radius:11px;padding:14px}

/* ── CMF BOARD v2 ── */
.cmf2-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:0}
.cmf2-card{background:var(--s1);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.cmf2-hdr{display:flex;align-items:baseline;gap:8px;padding:14px 16px 12px;border-bottom:1px solid var(--bd)}
.cmf2-en{font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--tx)}
.cmf2-zh{font-size:11px;color:var(--dim);letter-spacing:.06em}
.cmf2-body{padding:14px 16px;display:flex;flex-direction:column;gap:9px}
.cmf2-item{font-size:12px;line-height:1.6;color:var(--dim);display:flex;align-items:center;gap:7px}
.cmf2-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:1.5px solid rgba(255,255,255,.1)}
.cmf2-name{color:var(--tx);white-space:nowrap}
.cmf2-desc{color:var(--dim);font-size:11px}

/* ── ORIGIN VIEW ── */
.o6-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}
.o6-card{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:18px 20px;border-top:3px solid var(--color)}
.o6-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.o6-ico{font-size:16px}
.o6-lbl-en{font-size:9px;font-weight:600;letter-spacing:.15em;color:var(--color);text-transform:uppercase}
.o6-lbl-zh{font-size:13px;font-weight:600;color:var(--tx);margin-top:1px}
.o6-txt{font-size:12px;line-height:1.75;color:var(--dim)}

.origin-meta{display:flex;gap:24px;padding:20px 24px;background:var(--s1);border:1px solid var(--bd);border-radius:10px;margin-bottom:24px;flex-wrap:wrap}
.om-item{}
.om-k{font-size:9px;font-weight:600;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:5px}
.om-v{font-size:13px;color:var(--tx);line-height:1.4}
.lc-badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;border:1px solid;letter-spacing:.05em}

.events-timeline{display:flex;flex-direction:column;gap:0}
.ev-row{display:flex;gap:16px;position:relative}
.ev-row:not(:last-child) .ev-line{position:absolute;left:10px;top:22px;bottom:-12px;width:1px;background:var(--bd)}
.ev-dot{width:20px;height:20px;border-radius:50%;background:var(--s2);border:1.5px solid var(--ac);flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center}
.ev-inner{width:7px;height:7px;border-radius:50%;background:var(--ac)}
.ev-content{flex:1;padding-bottom:20px}
.ev-time{font-size:10px;color:var(--ac);font-weight:600;margin-bottom:4px}
.ev-txt{font-size:12.5px;color:var(--tx);line-height:1.55;margin-bottom:4px}
.ev-impact{font-size:11px;color:var(--dim)}

/* ── AUDIENCE VIEW ── */
.persona-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.persona-card{background:var(--s1);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.persona-head{padding:20px;background:var(--s2);display:flex;flex-direction:column;align-items:center;text-align:center;border-bottom:1px solid var(--bd)}
.persona-avatar{width:52px;height:52px;border-radius:50%;background:var(--ac);color:#0C0C0C;font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.persona-name{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;margin-bottom:4px}
.persona-age{font-size:11px;color:var(--ac);letter-spacing:.06em}
.persona-fields{padding:16px 18px;display:flex;flex-direction:column;gap:0}
.pf-row{padding:10px 0;border-bottom:1px solid var(--bd);display:flex;flex-direction:column;gap:5px}
.pf-row:last-child{border-bottom:none}
.pk{font-size:9px;font-weight:600;letter-spacing:.15em;color:var(--ac);text-transform:uppercase}
.pv{font-size:12px;line-height:1.65;color:var(--dim)}
.interest-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.i-tag{font-size:10.5px;padding:3px 9px;background:var(--s2);border-radius:20px;color:var(--dim)}

/* ── SCENARIOS VIEW ── */
.scn-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.scn-card{background:var(--s1);border:1px solid var(--bd);border-radius:11px;overflow:hidden}
.scn-num{font-size:9px;font-weight:600;letter-spacing:.2em;color:var(--dim);padding:16px 18px 0;text-transform:uppercase}
.scn-name{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;padding:6px 18px 0}
.scn-ctx{font-size:12px;line-height:1.75;color:var(--dim);padding:10px 18px;border-bottom:1px solid var(--bd);margin-bottom:0}
.scn-dir{font-size:11.5px;color:var(--ac);padding:12px 18px 16px}

/* ── SUBTRENDS VIEW ── */
.sub-list{display:flex;flex-direction:column;gap:10px}
.sub-card{background:var(--s1);border:1px solid var(--bd);border-radius:10px;overflow:hidden;display:grid;grid-template-columns:1fr 2fr;min-height:130px}
.sub-card-left{padding:18px 20px;border-right:1px solid var(--bd);background:var(--s2)}
.sub-card-en{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;margin-bottom:3px}
.sub-card-zh{font-size:11px;color:var(--dim);letter-spacing:.06em;margin-bottom:12px}
.sub-cases{display:flex;flex-direction:column;gap:4px}
.sub-case{font-size:10px;color:var(--dim);padding:2px 8px;background:var(--s3);border-radius:4px}
.sub-card-right{padding:18px 20px}
.sub-dir-lbl{font-size:9px;font-weight:600;letter-spacing:.15em;color:var(--ac);text-transform:uppercase;margin-bottom:7px}
.sub-dir-txt{font-size:13px;line-height:1.75;color:var(--tx)}

/* ── INDUSTRY VIEW ── */
.ind-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.ind-card{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:20px 22px}
.ind-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--bd)}
.ind-ico{font-size:18px}
.ind-name{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600}
.ind-sig{font-size:12.5px;line-height:1.8;color:var(--dim)}

/* ── NEWS FEED ── */
.news-wrap{padding:28px 36px 80px}
.news-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px}
.news-t{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;letter-spacing:.2em;color:var(--ac)}
.news-d{font-size:11px;color:var(--dim);margin-top:4px}
.news-hint{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.65}
.refresh-btn{padding:5px 12px;background:var(--s2);border:1px solid var(--bd);border-radius:6px;color:var(--dim);font-size:11px;cursor:pointer;flex-shrink:0;transition:.2s;margin-left:16px}
.refresh-btn:hover{border-color:var(--ac);color:var(--ac)}
.news-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.news-cat-hdr{font-size:9px;font-weight:600;letter-spacing:.15em;color:var(--dim);text-transform:uppercase;padding-bottom:8px;border-bottom:1px solid var(--bd);margin-bottom:10px}
.news-items{display:flex;flex-direction:column;gap:7px}
.news-item{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:11px 13px;cursor:pointer;transition:.2s;display:flex;gap:9px;align-items:flex-start}
.news-item:hover{border-color:#444}
.news-item.sel{border-color:var(--ac);background:rgba(212,197,169,.07)}
.news-cb{width:13px;height:13px;border:1.5px solid var(--bd);border-radius:3px;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:8px;color:transparent;transition:.2s}
.news-item.sel .news-cb{background:var(--ac);border-color:var(--ac);color:#0C0C0C}
.news-meta{font-size:9px;color:var(--dim);margin-bottom:3px}
.news-text{font-size:11.5px;line-height:1.5;color:var(--tx)}
.news-err{color:var(--dim);font-size:11px;opacity:.5}
.news-action{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 55%,transparent);padding:14px 36px 20px;display:flex;align-items:center;justify-content:flex-end;gap:12px;pointer-events:none;opacity:0;transition:.3s}
.news-action.show{opacity:1;pointer-events:all}
.news-go{padding:10px 22px;background:var(--ac);border:none;border-radius:8px;color:#0C0C0C;font-size:12px;font-weight:700;font-family:'Space Grotesk',sans-serif;cursor:pointer;transition:.2s}
.news-go:hover{background:var(--ac2)}

/* ── LOADING / ERROR ── */
.center-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:calc(100vh - 57px);gap:16px}
.load-bar{width:160px;height:2px;background:var(--bd);border-radius:1px;overflow:hidden}
.load-prog{height:100%;background:var(--ac);animation:prog 1.6s ease-in-out infinite}
@keyframes prog{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
.load-txt{font-size:11px;color:var(--dim);letter-spacing:.07em}
.err-box{background:rgba(200,60,60,.1);border:1px solid rgba(200,60,60,.3);border-radius:8px;padding:14px 18px;font-size:13px;color:#E88;margin:30px 36px}

/* Scrollbar */
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:28px;width:400px;max-width:90vw;position:relative}
.modal-t{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;margin-bottom:6px}
.modal-s{font-size:12px;color:var(--dim);line-height:1.7;margin-bottom:18px}
.modal-row{display:flex;gap:8px}
.modal-row input{flex:1;background:var(--s2);border:1px solid var(--bd);border-radius:6px;padding:9px 11px;color:var(--tx);font-size:12px;font-family:monospace;outline:none;transition:.2s}
.modal-row input:focus{border-color:var(--ac)}
.btn-xs{padding:9px 13px;background:var(--s2);border:1px solid var(--bd);border-radius:6px;color:var(--tx);font-size:11px;cursor:pointer;white-space:nowrap}
.btn-xs:hover{border-color:var(--ac)}
.modal-hint{font-size:11px;color:var(--dim);margin-top:10px;line-height:1.6}
.modal-hint a{color:var(--ac)}
.modal-x{position:absolute;top:13px;right:16px;background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer}
</style>
</head>
<body>

<header class="hdr">
  <div><div class="logo">TREND AGENT</div><div class="logo-s">跨行业趋势研究系统 · Powered by DeepSeek</div></div>
  <div class="api-chip" onclick="showModal()">
    <div class="dot" id="dot"></div><span id="apiTxt">配置 API Key</span>
  </div>
</header>

<div class="wrap">
  <!-- ── LEFT: input + nav ── -->
  <aside class="left">
    <div class="left-input">
      <div class="input-lbl">输入信息</div>
      <textarea class="field" id="inp" placeholder="每条信息单独一行，可混合多个行业

Apple Vision Pro 空间计算
Prada 秋冬回收尼龙主材
小米汽车 SU7 编织内饰"></textarea>
      <button class="btn-go" id="goBtn" onclick="analyze()">分析趋势 →</button>
    </div>

    <div class="left-nav" id="leftNav">
      <div class="nav-empty">输入信息并点击分析<br>导航菜单将出现在这里</div>
    </div>
  </aside>

  <!-- ── RIGHT: content ── -->
  <main class="right" id="right"></main>
</div>

<!-- Modal -->
<div class="modal-bg" id="modalBg" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <button class="modal-x" onclick="closeModal()">×</button>
    <div class="modal-t">DeepSeek API Key</div>
    <div class="modal-s">Key 仅存储在你的浏览器本地，不会上传到任何服务器。</div>
    <div class="modal-row">
      <input type="password" id="keyInp" placeholder="sk-..."/>
      <button class="btn-xs" onclick="saveKey()">保存</button>
    </div>
    <div class="modal-hint">前往 <a href="https://platform.deepseek.com" target="_blank">platform.deepseek.com</a> 注册获取</div>
  </div>
</div>

<script>
const UNSPLASH = 'VD49E1CnAoIl05mkqyK85HxXSYBqHQZNq9lgHZbUCC4';
const RSS_FEEDS = [
  {cat:'消费电子', url:'https://www.theverge.com/rss/index.xml'},
  {cat:'时尚', url:'https://www.dezeen.com/category/fashion/feed/'},
  {cat:'汽车', url:'https://electrek.co/feed/'},
  {cat:'家居设计', url:'https://www.dezeen.com/feed/'}
];

const S = {
  key: localStorage.getItem('ta_key')||'',
  tab: 'board',   // board | origin | audience | scenarios | subtrends | industry
  ly: 'Storytelling',
  result: null,
  imgs: {},
  news: null, selNews: new Set(),
  loading: false, newsLoading: false, error: null
};

const NAV_ITEMS = [
  {id:'board',    ico:'◈', label:'视觉看板'},
  {id:'origin',   ico:'◎', label:'趋势来源'},
  {id:'audience', ico:'◉', label:'目标人群'},
  {id:'scenarios',ico:'◆', label:'使用场景'},
  {id:'subtrends',ico:'◇', label:'子趋势'},
  {id:'industry', ico:'◐', label:'行业信号'}
];
const LAYOUTS = ['Storytelling','CMF Board','Collage','Minimal','Trend Map'];
const LAYOUT_IDS = ['Storytelling','CMF','Collage','Minimal','Map'];

const O6_FACTORS = [
  {key:'social',      ico:'🌍', zh:'社会', en:'Social',        color:'#C4803A'},
  {key:'economic',    ico:'📈', zh:'经济', en:'Economic',      color:'#4C9'},
  {key:'technology',  ico:'⚡', zh:'科技', en:'Technology',    color:'#4A8FF5'},
  {key:'environmental',ico:'🌿',zh:'环境', en:'Environmental', color:'#5BAE7E'},
  {key:'political',   ico:'⚖️', zh:'政治', en:'Political',     color:'#9B72CF'},
  {key:'cultural',    ico:'🎨', zh:'文化', en:'Cultural',      color:'#E57DA0'}
];
const IND_ICOS = {消费电子:'📱',汽车:'🚗',家居:'🏠',时尚:'✨'};

updateStatus();
if (!S.key) setTimeout(showModal, 500);
renderNav(); renderRight();
loadNews();

function updateStatus(){
  document.getElementById('dot').classList.toggle('on',!!S.key);
  document.getElementById('apiTxt').textContent=S.key?'API 已连接':'配置 API Key';
}
function showModal(){document.getElementById('modalBg').style.display='flex';}
function closeModal(){document.getElementById('modalBg').style.display='none';}
function saveKey(){
  const v=document.getElementById('keyInp').value.trim();
  if(!v||v.startsWith('•')){closeModal();return;}
  S.key=v;localStorage.setItem('ta_key',v);updateStatus();closeModal();
}

// ── NAV ──
function renderNav(){
  const el=document.getElementById('leftNav');
  if(!S.result){
    el.innerHTML=`<div class="nav-empty">输入信息并点击分析<br>导航菜单将出现在这里</div>`;
    return;
  }
  let h=`<div class="nav-sec-lbl">分析报告</div>`;
  NAV_ITEMS.forEach(item=>{
    const active=S.tab===item.id;
    h+=`<div class="nav-item ${active?'active':''}" onclick="selTab('${item.id}')">
      <span class="nav-ico">${item.ico}</span>${esc(item.label)}
    </div>`;
    if(item.id==='board'&&active){
      h+=`<div class="nav-subs">`;
      LAYOUT_IDS.forEach((lid,i)=>{
        h+=`<div class="nav-sub ${S.ly===lid?'active':''}" onclick="selLy('${lid}')">${esc(LAYOUTS[i])}</div>`;
      });
      h+=`</div>`;
    }
  });
  el.innerHTML=h;
}

function selTab(tab){S.tab=tab;renderNav();renderRight();}
function selLy(ly){S.ly=ly;renderNav();renderRight();}

// ── NEWS ──
async function loadNews(){
  S.newsLoading=true; S.news=null;
  if(!S.result) renderRight();
  const results=await Promise.all(RSS_FEEDS.map(async f=>{
    try{
      const res=await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(f.url)}&count=4`);
      const d=await res.json();
      return{cat:f.cat,items:(d.items||[]).slice(0,4).map(it=>({
        title:it.title||'',
        date:it.pubDate?new Date(it.pubDate).toLocaleDateString('zh-CN',{month:'short',day:'numeric'}):'',
        source:(it.author||d.feed?.title||'').slice(0,20)
      }))};
    }catch{return{cat:f.cat,items:[],err:true};}
  }));
  S.news=results; S.newsLoading=false;
  if(!S.result) renderRight();
}
function toggleNews(idx){
  if(S.selNews.has(idx))S.selNews.delete(idx);else S.selNews.add(idx);
  renderRight();
}
function analyzeFromNews(){
  const lines=[];let i=0;
  (S.news||[]).forEach(cat=>cat.items.forEach(item=>{
    if(S.selNews.has(i))lines.push(`[${cat.cat}] ${item.title}`);i++;
  }));
  if(!lines.length)return;
  document.getElementById('inp').value=lines.join('\n');
  S.selNews.clear();analyze();
}

// ── PROMPT ──
const PROMPT=`你是「跨行业趋势研究 + 设计表达 Agent」。只输出 JSON，绝对不要任何解释：

{
  "core_trend":{
    "name_en":"2-3词英文趋势名（有力量）",
    "name_zh":"中文趋势名",
    "definition":"2-3句趋势定义",
    "emotion":"核心情绪词"
  },
  "trend_origin":{
    "social":"社会因素：人口结构变化、消费行为转变、社会思潮（2-3句）",
    "economic":"经济因素：经济环境、消费力变化、产业格局（2-3句）",
    "technology":"科技因素：技术突破、数字化、制造工艺革新（2-3句）",
    "environmental":"环境因素：可持续性、气候意识、材料限制（2-3句）",
    "political":"政治因素：政策法规、贸易环境、监管变化（2-3句）",
    "cultural":"文化因素：审美演变、文化输出、跨文化影响（2-3句）",
    "start_period":"趋势开始活跃的时间段",
    "duration_forecast":"预计持续时间段（并简述原因）",
    "lifecycle":"从以下选一个：萌芽期/成长期/成熟期/衰退期",
    "key_events":[
      {"event":"关键事件名称","time":"YYYY年M月","impact":"对趋势的推动作用（1句）"}
    ]
  },
  "industry_signals":[
    {"industry":"消费电子","signal":"该行业具体品牌/产品动态（1-2句）"},
    {"industry":"汽车","signal":"..."},
    {"industry":"家居","signal":"..."},
    {"industry":"时尚","signal":"..."}
  ],
  "sub_trends":[
    {
      "name_en":"子趋势英文名",
      "name_zh":"子趋势中文名",
      "direction":"变化方向（一句话，是变化不是描述）",
      "cases":["品牌 · 产品 · 年份"],
      "img_kw":"3-5 word Unsplash editorial search — use: editorial/luxury/minimal/craft/studio/detail/texture descriptors, specific not generic"
    }
  ],
  "cmf":{
    "color":[{"name":"色彩名","hex":"#RRGGBB","desc":"设计含义"}],
    "material":["材质1","材质2","材质3"],
    "finish":["工艺1","工艺2"],
    "texture":["纹理1","纹理2"]
  },
  "emotion_keywords":["词1","词2","词3","词4"],
  "target_audience":[
    {
      "name":"人群标签",
      "age":"年龄段",
      "occupation":"职业描述",
      "family":"家庭情况（1句）",
      "lifestyle":"生活方式（2句，具体生动）",
      "interests":["兴趣1","兴趣2","兴趣3","兴趣4"],
      "usage_habits":"与此趋势相关的使用习惯（2句）"
    }
  ],
  "use_scenarios":[
    {"name":"场景名称","context":"场景描述（2句话）","direction":"产品或设计方向"}
  ],
  "narrative":{
    "start":"起点场景（2句）",
    "develop":"发展过程（2句）",
    "turn":"关键转折（2句）",
    "express":"设计表达（2句）",
    "emotion":"情绪结语（1句）"
  },
  "visual_kw":["整体趋势氛围editorial摄影词","材质纹理特写词","生活场景词"],
  "headline":"主标题（英文，3词内）"
}

规则：sub_trends 3-5个；target_audience 3个；use_scenarios 3个；key_events 2-4个；只输出JSON。`;

function parseJ(t){
  try{return JSON.parse(t);}catch{}
  const m=t.match(/```(?:json)?\s*([\s\S]*?)```/);
  if(m){try{return JSON.parse(m[1]);}catch{}}
  const s=t.indexOf('{'),e=t.lastIndexOf('}');
  if(s!==-1&&e!==-1){try{return JSON.parse(t.slice(s,e+1));}catch{}}
  throw new Error('JSON 解析失败，请重试');
}

async function analyze(){
  const txt=document.getElementById('inp').value.trim();
  if(!txt){alert('请先输入信息');return;}
  if(!S.key){showModal();return;}
  S.loading=true;S.result=null;S.imgs={};S.error=null;S.tab='board';
  document.getElementById('goBtn').disabled=true;
  renderNav();renderRight();
  try{
    const res=await fetch('https://api.deepseek.com/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${S.key}`},
      body:JSON.stringify({
        model:'deepseek-chat',
        messages:[{role:'system',content:PROMPT},{role:'user',content:txt}],
        temperature:0.75,
        response_format:{type:'json_object'}
      })
    });
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error?.message||`HTTP ${res.status}`);}
    const data=await res.json();
    S.result=parseJ(data.choices[0].message.content);
    S.loading=false;renderNav();renderRight();
    fetchImgs(S.result);
  }catch(e){S.error=e.message;S.loading=false;renderNav();renderRight();}
  document.getElementById('goBtn').disabled=false;
}

async function fetchImgs(r){
  const kws=[...(r.visual_kw||[]),...(r.sub_trends||[]).map(s=>s.img_kw).filter(Boolean)].filter(Boolean);
  await Promise.all([...new Set(kws)].map(async kw=>{
    try{
      const res=await fetch(
        `https://api.unsplash.com/search/photos?query=${encodeURIComponent(kw)}&per_page=8&orientation=landscape&content_filter=high`,
        {headers:{'Authorization':`Client-ID ${UNSPLASH}`}}
      );
      const d=await res.json();
      const results=d.results||[];
      if(results.length){
        const best=results.slice(0,5).sort((a,b)=>b.likes-a.likes)[0];
        S.imgs[kw]=best.urls.regular;
      }
    }catch{}
    if(S.result===r)renderRight();
  }));
}

// ── RENDER RIGHT ──
function renderRight(){
  const el=document.getElementById('right');
  if(S.loading){
    el.innerHTML=`<div class="center-state"><div class="load-bar"><div class="load-prog"></div></div><div class="load-txt">正在分析趋势...</div></div>`;
    return;
  }
  if(S.error){el.innerHTML=`<div class="err-box">⚠ ${esc(S.error)}</div>`;return;}
  if(S.result){
    const r=S.result;
    if(S.tab==='board')     el.innerHTML=vBoard(r);
    else if(S.tab==='origin')    el.innerHTML=vOrigin(r);
    else if(S.tab==='audience')  el.innerHTML=vAudience(r);
    else if(S.tab==='scenarios') el.innerHTML=vScenarios(r);
    else if(S.tab==='subtrends') el.innerHTML=vSubtrends(r);
    else if(S.tab==='industry')  el.innerHTML=vIndustry(r);
    return;
  }
  // News
  const today=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'});
  let h=`<div class="news-wrap"><div class="news-top">
    <div><div class="news-t">TODAY'S SIGNALS</div><div class="news-d">${today}</div><div class="news-hint">勾选信号，一键填入分析</div></div>
    <button class="refresh-btn" onclick="loadNews()">↻ 刷新</button>
  </div>`;
  if(S.newsLoading||!S.news){h+=`<div style="color:var(--dim);font-size:12px;padding:16px 0">正在获取资讯...</div>`;}
  else{
    h+=`<div class="news-grid">`;
    let gi=0;
    S.news.forEach(cat=>{
      h+=`<div><div class="news-cat-hdr">${esc(cat.cat)}</div><div class="news-items">`;
      if(cat.err||!cat.items.length){h+=`<div class="news-err">暂无数据</div>`;}
      else cat.items.forEach(item=>{
        const idx=gi,sel=S.selNews.has(idx);
        h+=`<div class="news-item ${sel?'sel':''}" onclick="toggleNews(${idx})">
          <div class="news-cb">${sel?'✓':''}</div>
          <div><div class="news-meta">${esc(item.source)}${item.date?' · '+esc(item.date):''}</div><div class="news-text">${esc(item.title)}</div></div>
        </div>`;
        gi++;
      });
      h+=`</div></div>`;
    });
    h+=`</div>`;
  }
  h+=`</div>`;
  const n=S.selNews.size;
  h+=`<div class="news-action ${n>0?'show':''}"><span style="font-size:12px;color:var(--dim)">已选 ${n} 条</span><button class="news-go" onclick="analyzeFromNews()">分析选中信号 →</button></div>`;
  el.innerHTML=h;
}

// ── VIEW: BOARD ──
function vBoard(r){
  let h='<div class="view">';
  h+=`<div class="brd-hdr">
    <div class="t-en">${esc(r.core_trend?.name_en||'')}</div>
    <div class="t-zh">${esc(r.core_trend?.name_zh||'')}</div>
    <div class="t-def">${esc(r.core_trend?.definition||'')}</div>
    <div class="pills">${(r.emotion_keywords||[]).map(k=>`<div class="pill">${esc(k)}</div>`).join('')}</div>
  </div>`;
  if(S.ly==='Storytelling')h+=bStory(r);
  else if(S.ly==='CMF')h+=bCMF(r);
  else if(S.ly==='Collage')h+=bCollage(r);
  else if(S.ly==='Minimal')h+=bMinimal(r);
  else if(S.ly==='Map')h+=bMap(r);
  return h+'</div>';
}

function imgEl(kw,h=180){
  const src=kw?(S.imgs[kw]||''):'';
  return `<div class="img-box" style="height:${h}px">${!src?'<div class="shimmer"></div>':''}<img src="${src}" alt="" loading="lazy"></div>`;
}
function imgSrc(kw){return kw?(S.imgs[kw]||''):'';}

function bStory(r){
  const nav=r.narrative||{},vkw=(r.visual_kw||[])[0]||'',subs=r.sub_trends||[];
  const stages=[{l:'起点',t:nav.start},{l:'发展',t:nav.develop},{l:'转折',t:nav.turn},{l:'表达',t:nav.express},{l:'情绪',t:nav.emotion}];
  return `<div class="story-hero"><img src="${imgSrc(vkw)}" alt=""></div>
  <div class="story-flow">${stages.map((s,i)=>`<div class="sc">
    <div class="sc-img">${imgEl(subs[i]?.img_kw||(r.visual_kw||[])[i]||'',70)}</div>
    <div class="sc-body"><div class="sc-lbl">${s.l}</div><div class="sc-txt">${esc(s.t||'—')}</div></div>
  </div>`).join('')}</div>`;
}
function bCMF(r){
  const cmf=r.cmf||{},colors=cmf.color||[],subs=r.sub_trends||[];
  const pal=colors.map(c=>`<div class="sw" style="background:${c.hex||'#333'}"><div class="sw-lbl">${esc(c.name||'')}</div></div>`).join('');
  const colorItems=colors.map(c=>`<div class="cmf2-item"><span class="cmf2-dot" style="background:${c.hex||'#888'}"></span><span class="cmf2-name">${esc(c.name||'')}</span>${c.desc?`<span class="cmf2-desc"> — ${esc(c.desc)}</span>`:''}</div>`).join('');
  const matItems=(cmf.material||[]).map(m=>`<div class="cmf2-item">${esc(m)}</div>`).join('');
  const finItems=(cmf.finish||[]).map(f=>`<div class="cmf2-item">${esc(f)}</div>`).join('');
  const texItems=(cmf.texture||[]).map(t=>`<div class="cmf2-item">${esc(t)}</div>`).join('');
  const subSection=subs.length?`<div style="margin-top:22px">
    <div class="view-en" style="margin-bottom:12px">SUB TRENDS 潜在趋势</div>
    <div class="sub-list">${subs.map(s=>`<div class="sub-card">
      <div class="sub-card-left">
        <div class="sub-card-en">${esc(s.name_en||'')}</div>
        <div class="sub-card-zh">${esc(s.name_zh||'')}</div>
        <div class="sub-cases">${(s.cases||[]).map(c=>`<span class="sub-case">${esc(c)}</span>`).join('')}</div>
      </div>
      <div class="sub-card-right">
        <div class="sub-dir-lbl">变化方向</div>
        <div class="sub-dir-txt">${esc(s.direction||'')}</div>
      </div>
    </div>`).join('')}</div>
  </div>`:'';
  return `<div class="cmf-pal">${pal}</div>
  <div class="cmf2-grid">
    <div class="cmf2-card">
      <div class="cmf2-hdr"><span class="cmf2-en">COLOR</span><span class="cmf2-zh">颜色</span></div>
      <div class="cmf2-body">${colorItems}</div>
    </div>
    <div class="cmf2-card">
      <div class="cmf2-hdr"><span class="cmf2-en">MATERIAL</span><span class="cmf2-zh">材质</span></div>
      <div class="cmf2-body">${matItems}</div>
    </div>
    <div class="cmf2-card">
      <div class="cmf2-hdr"><span class="cmf2-en">FINISH</span><span class="cmf2-zh">完成</span></div>
      <div class="cmf2-body">${finItems}</div>
    </div>
    <div class="cmf2-card">
      <div class="cmf2-hdr"><span class="cmf2-en">TEXTURE</span><span class="cmf2-zh">纹理</span></div>
      <div class="cmf2-body">${texItems}</div>
    </div>
  </div>${subSection}`;
}
function bCollage(r){
  const subs=r.sub_trends||[],vkws=r.visual_kw||[];
  const items=[...subs.slice(0,3).map(s=>({kw:s.img_kw,t:s.name_en,txt:s.direction})),
    ...vkws.slice(0,3).map((kw,i)=>({kw,t:['Tension','Layer','Form'][i]||'',txt:subs[i+3]?.direction||r.core_trend?.definition||''}))].slice(0,6);
  return `<div class="col-wrap"><div class="col-bg">${esc(r.core_trend?.name_en||'')}</div>
  <div class="col-grid">${items.map(it=>`<div class="col-card">
    <div class="col-img">${imgEl(it.kw,110)}</div>
    <div class="col-body"><div class="col-tag">${esc(it.t)}</div><div class="col-txt">${esc(it.txt)}</div></div>
  </div>`).join('')}</div></div>`;
}
function bMinimal(r){
  const vkw=(r.visual_kw||[])[0]||(r.sub_trends||[])[0]?.img_kw||'',subs=r.sub_trends||[];
  return `<div class="min-hero"><img src="${imgSrc(vkw)}" alt=""><div class="min-name">${esc(r.headline||r.core_trend?.name_en||'')}</div></div>
  <div class="min-grid">${[0,1,2].map(i=>`<div class="min-card">
    <div class="min-card-img">${imgEl(subs[i]?.img_kw||'',95)}</div>
    <div class="min-card-body"><div class="min-card-lbl">Direction ${String(i+1).padStart(2,'0')}</div><div class="min-card-txt">${esc(subs[i]?.direction||'')}</div></div>
  </div>`).join('')}</div>`;
}
function bMap(r){
  const subs=r.sub_trends||[],n=subs.length;
  if(!n)return '';
  const W=660,H=420,cx=W/2,cy=H/2,cR=60,sR=46,orb=165;
  const pts=subs.map((s,i)=>{const a=(i/n)*2*Math.PI-Math.PI/2;return{...s,x:cx+Math.cos(a)*orb,y:cy+Math.sin(a)*orb,a};});
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block">`;
  pts.forEach(p=>svg+=`<line x1="${cx}" y1="${cy}" x2="${p.x}" y2="${p.y}" stroke="#2A2A2A" stroke-width="1.5" stroke-dasharray="5,4"/>`);
  pts.forEach(p=>(p.cases||[]).slice(0,2).forEach((c,j)=>{
    const ca=p.a+(j?0.38:-0.38),d=103;
    const px=Math.max(35,Math.min(W-35,p.x+Math.cos(ca)*d));
    const py=Math.max(16,Math.min(H-16,p.y+Math.sin(ca)*d));
    svg+=`<line x1="${p.x}" y1="${p.y}" x2="${px}" y2="${py}" stroke="#222" stroke-width="1"/>`;
    svg+=`<circle cx="${px}" cy="${py}" r="4" fill="#D4C5A9" opacity=".6"/>`;
    svg+=`<text x="${px}" y="${py-8}" text-anchor="middle" fill="#666" font-size="7.5" font-family="Inter">${esc((c.split('·')[0]||c).trim().slice(0,12))}</text>`;
  }));
  pts.forEach(p=>{
    svg+=`<circle cx="${p.x}" cy="${p.y}" r="${sR}" fill="#1E1E1E" stroke="#D4C5A9" stroke-width="1.5"/>`;
    svg+=`<text x="${p.x}" y="${p.y-4}" text-anchor="middle" fill="#F0EDE8" font-size="9" font-family="Space Grotesk" font-weight="600">${esc((p.name_en||'').slice(0,14))}</text>`;
    svg+=`<text x="${p.x}" y="${p.y+10}" text-anchor="middle" fill="#888" font-size="8" font-family="Inter">${esc((p.name_zh||'').slice(0,6))}</text>`;
  });
  svg+=`<circle cx="${cx}" cy="${cy}" r="${cR}" fill="#D4C5A9"/>`;
  svg+=`<text x="${cx}" y="${cy-4}" text-anchor="middle" fill="#0C0C0C" font-size="10" font-family="Space Grotesk" font-weight="700">${esc((r.core_trend?.name_en||'').slice(0,14))}</text>`;
  svg+=`<text x="${cx}" y="${cy+11}" text-anchor="middle" fill="#0C0C0C" font-size="9" font-family="Inter" opacity=".75">${esc((r.core_trend?.name_zh||'').slice(0,6))}</text>`;
  svg+='</svg>';
  return `<div class="map-wrap">${svg}</div>`;
}

// ── VIEW: ORIGIN ──
function vOrigin(r){
  const o=r.trend_origin||{};
  const lcMap={'萌芽期':'#C4803A','成长期':'#4C9','成熟期':'#4A8FF5','衰退期':'#888'};
  const lc=o.lifecycle||'';
  const cards=O6_FACTORS.map(f=>`
    <div class="o6-card" style="--color:${f.color}">
      <div class="o6-header">
        <span class="o6-ico">${f.ico}</span>
        <div><div class="o6-lbl-en">${f.en}</div><div class="o6-lbl-zh">${f.zh}</div></div>
      </div>
      <div class="o6-txt">${esc(o[f.key]||'—')}</div>
    </div>`).join('');
  const events=(o.key_events||[]).map(ev=>`
    <div class="ev-row">
      <div style="position:relative"><div class="ev-dot"><div class="ev-inner"></div></div><div class="ev-line"></div></div>
      <div class="ev-content">
        <div class="ev-time">${esc(ev.time||'')}</div>
        <div class="ev-txt">${esc(ev.event||'')}</div>
        ${ev.impact?`<div class="ev-impact">→ ${esc(ev.impact)}</div>`:''}
      </div>
    </div>`).join('');
  return `<div class="view">
    <div class="view-hdr">
      <div class="view-en">Trend Origin</div>
      <div class="view-t">趋势来源</div>
      <div class="view-sub">${esc(r.core_trend?.name_zh||'')}的形成受六大维度驱动因素影响</div>
    </div>
    <div class="o6-grid">${cards}</div>
    <div class="origin-meta">
      <div class="om-item"><div class="om-k">起始时间</div><div class="om-v">${esc(o.start_period||'—')}</div></div>
      <div class="om-item"><div class="om-k">持续预测</div><div class="om-v">${esc(o.duration_forecast||'—')}</div></div>
      <div class="om-item"><div class="om-k">生命阶段</div><div class="om-v"><span class="lc-badge" style="border-color:${lcMap[lc]||'var(--ac)'};color:${lcMap[lc]||'var(--ac)'}">${esc(lc||'—')}</span></div></div>
    </div>
    ${events?`<div style="margin-top:4px"><div class="view-en" style="margin-bottom:14px">Key Events</div><div class="events-timeline">${events}</div></div>`:''}
  </div>`;
}

// ── VIEW: AUDIENCE ──
function vAudience(r){
  const aud=r.target_audience||[];
  const colors=['#C4803A','#4A8FF5','#5BAE7E'];
  const cards=aud.map((a,i)=>{
    const initials=(a.name||'A').slice(0,2);
    const tags=(a.interests||[]).map(t=>`<span class="i-tag">${esc(t)}</span>`).join('');
    return `<div class="persona-card">
      <div class="persona-head">
        <div class="persona-avatar" style="background:${colors[i]||'var(--ac)'}">${esc(initials)}</div>
        <div class="persona-name">${esc(a.name||'')}</div>
        <div class="persona-age">${esc(a.age||'')}</div>
      </div>
      <div class="persona-fields">
        <div class="pf-row"><span class="pk">职业</span><span class="pv">${esc(a.occupation||'—')}</span></div>
        <div class="pf-row"><span class="pk">家庭</span><span class="pv">${esc(a.family||'—')}</span></div>
        <div class="pf-row"><span class="pk">生活方式</span><span class="pv">${esc(a.lifestyle||'—')}</span></div>
        <div class="pf-row"><span class="pk">兴趣爱好</span><div class="interest-tags">${tags||'—'}</div></div>
        <div class="pf-row"><span class="pk">使用习惯</span><span class="pv">${esc(a.usage_habits||'—')}</span></div>
      </div>
    </div>`;
  }).join('');
  return `<div class="view">
    <div class="view-hdr">
      <div class="view-en">Target Audience</div>
      <div class="view-t">目标人群</div>
      <div class="view-sub">与「${esc(r.core_trend?.name_zh||'')}」趋势高度相关的三类核心人群画像</div>
    </div>
    <div class="persona-grid">${cards}</div>
  </div>`;
}

// ── VIEW: SCENARIOS ──
function vScenarios(r){
  const scn=r.use_scenarios||[];
  const cards=scn.map((s,i)=>`<div class="scn-card">
    <div class="scn-num">场景 ${String(i+1).padStart(2,'0')}</div>
    <div class="scn-name">${esc(s.name||'')}</div>
    <div class="scn-ctx">${esc(s.context||'')}</div>
    <div class="scn-dir">→ ${esc(s.direction||'')}</div>
  </div>`).join('');
  return `<div class="view">
    <div class="view-hdr">
      <div class="view-en">Use Scenarios</div>
      <div class="view-t">风格使用场景</div>
      <div class="view-sub">此趋势在日常生活中的典型应用情境与设计机会</div>
    </div>
    <div class="scn-grid">${cards}</div>
  </div>`;
}

// ── VIEW: SUBTRENDS ──
function vSubtrends(r){
  const subs=r.sub_trends||[];
  const cards=subs.map(s=>`<div class="sub-card">
    <div class="sub-card-left">
      <div class="sub-card-en">${esc(s.name_en||'')}</div>
      <div class="sub-card-zh">${esc(s.name_zh||'')}</div>
      <div class="sub-cases">${(s.cases||[]).map(c=>`<span class="sub-case">${esc(c)}</span>`).join('')}</div>
    </div>
    <div class="sub-card-right">
      <div class="sub-dir-lbl">变化方向</div>
      <div class="sub-dir-txt">${esc(s.direction||'')}</div>
    </div>
  </div>`).join('');
  return `<div class="view">
    <div class="view-hdr">
      <div class="view-en">Sub Trends</div>
      <div class="view-t">子趋势</div>
      <div class="view-sub">「${esc(r.core_trend?.name_zh||'')}」下分支的细分趋势方向</div>
    </div>
    <div class="sub-list">${cards}</div>
  </div>`;
}

// ── VIEW: INDUSTRY ──
function vIndustry(r){
  const sigs=r.industry_signals||[];
  const cards=sigs.map(s=>`<div class="ind-card">
    <div class="ind-header">
      <span class="ind-ico">${IND_ICOS[s.industry]||'📌'}</span>
      <div class="ind-name">${esc(s.industry||'')}</div>
    </div>
    <div class="ind-sig">${esc(s.signal||'')}</div>
  </div>`).join('');
  return `<div class="view">
    <div class="view-hdr">
      <div class="view-en">Industry Signals</div>
      <div class="view-t">行业信号</div>
      <div class="view-sub">「${esc(r.core_trend?.name_zh||'')}」在各行业中的具体表现与动态</div>
    </div>
    <div class="ind-grid">${cards}</div>
  </div>`;
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
</script>
